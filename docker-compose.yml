services:
  postgres:
    image: postgres:16-alpine
    container_name: taxflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxflow
      POSTGRES_PASSWORD: taxflow_dev
      POSTGRES_DB: taxflow_spain
    ports:
      - "5432:5432"
    volumes:
      - taxflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxflow -d taxflow_spain"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taxflow_postgres_data:
